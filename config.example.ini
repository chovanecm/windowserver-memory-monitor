# WindowServer Memory Monitor Configuration
# ==========================================

[settings]

# Memory threshold in gigabytes (GB)
# When WindowServer exceeds this amount, configured apps will be restarted
# Common values:
#   - 2.0 for aggressive monitoring (16GB systems)
#   - 3.0 for balanced monitoring (most systems)
#   - 4.0 or higher for relaxed monitoring (32GB+ systems)
memory_threshold_gb = 3.0

# Comma-separated list of applications to restart when threshold is exceeded
# App names must match exactly as they appear in /Applications
# Common culprits:
#   - DockDoor (window previews)
#   - alt-tab (window switcher)
#   - Rectangle (window manager)
#   - BetterTouchTool
#   - Magnet
apps_to_restart = DockDoor, alt-tab
