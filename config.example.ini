# WindowServer Memory Monitor Configuration - Example
# ===================================================
# Copy this file to config.ini and customize for your needs

[settings]

# Memory threshold in gigabytes (GB)
# When WindowServer exceeds this amount, configured apps will be restarted
# Default: 3.0
# Common values:
#   - 2.0 for aggressive monitoring (16GB systems)
#   - 3.0 for balanced monitoring (most systems)
#   - 4.0 or higher for relaxed monitoring (32GB+ systems)
memory_threshold_gb = 3.0

# Comma-separated list of applications to restart when threshold is exceeded
# App names must match exactly as they appear in /Applications
# Common culprits for WindowServer memory leaks:
#   - DockDoor (window previews)
#   - alt-tab (window switcher)
#   - Rectangle (window manager)
#   - BetterTouchTool (gesture tools)
#   - Magnet (window manager)
#
# Examples:
#   apps_to_restart = DockDoor
#   apps_to_restart = DockDoor, alt-tab
#   apps_to_restart = DockDoor, Rectangle, BetterTouchTool
apps_to_restart = DockDoor, alt-tab

# Tips:
# -----
# 1. Start with a higher threshold and lower it if needed
# 2. Monitor Activity Monitor to see typical WindowServer usage
# 3. Check logs at ~/Library/Logs/windowserver_monitor.out.log
# 4. Test with: python3 monitor_dockdoor.py --dry-run --verbose
