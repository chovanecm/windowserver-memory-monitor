name: Validate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Validate Python Script
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Check Python syntax
      run: python3 -m py_compile monitor_dockdoor.py
    
    - name: Verify help text works
      run: python3 monitor_dockdoor.py --help
    
    - name: Test dry-run mode
      run: python3 monitor_dockdoor.py --dry-run --verbose || true
      # Note: Will fail without config.ini, but tests argument parsing
    
    - name: Check file structure
      run: |
        test -f README.md
        test -f LICENSE
        test -f CONTRIBUTING.md
        test -f TROUBLESHOOTING.md
        test -f config.example.ini
        test -f Makefile
        echo "✓ All required files present"
    
    - name: Validate Makefile targets
      run: |
        make help
        echo "✓ Makefile help works"
